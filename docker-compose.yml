services:
  postgres:
    image: postgres:16
    container_name: gamc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gamc_seguridad}
    ports:
      - '5432:5432'
    volumes:
      - gamc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gamc_seguridad}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gamc_postgres_data:
    name: gamc_postgres_data
