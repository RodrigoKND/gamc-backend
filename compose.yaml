services:
  postgres:
    image: postgres:16-alpine
    container_name: gamc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamc_seguridad
      POSTGRES_USER: gamc
      POSTGRES_PASSWORD: gamc_local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gamc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamc -d gamc_seguridad"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  gamc_postgres_data:
    name: gamc-postgres-data
